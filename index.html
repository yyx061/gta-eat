<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTA 今天吃什么</title>
<meta name="description" content="GTA 附近餐馆灵感：按步行、骑车或打车时间划范围，看到店时还开不开门。">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今天吃什么">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 侧边导航（手机上变成底部标签栏） -->
  <nav class="side" aria-label="功能">
    <div class="brand">
      <div class="logo">今天吃什么</div>
      <div class="clock" id="clock"></div>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" data-view="rand" id="tab-rand"><span class="ico" aria-hidden="true">🎲</span><span class="tl">随便吃<small>不知道吃什么</small></span></button>
      <button type="button" class="tab" role="tab" data-view="find" id="tab-find"><span class="ico" aria-hidden="true">🔍</span><span class="tl">找一家<small>想好了吃什么</small></span></button>
      <button type="button" class="tab" role="tab" data-view="fav" id="tab-fav"><span class="ico" aria-hidden="true">★</span><span class="tl">收藏<small id="fav-count"></small></span></button>
    </div>
    <button type="button" class="about-btn" id="about-btn">关于数据</button>
  </nav>

  <main class="content">
    <!-- 条件：一句话 -->
    <section class="query" aria-label="出发条件">
      <p class="sentence">
        从 <button type="button" class="tok" id="tok-loc"></button> 出发，
        <span class="modes" id="mode-seg" role="radiogroup" aria-label="交通方式"></span>
        <span class="mins" id="mins-seg" role="radiogroup" aria-label="最多多少分钟"></span> 分钟内，
        <button type="button" class="tok" id="tok-when"></button>
      </p>
      <div class="pop" id="pop-loc" hidden>
        <form class="addr" id="loc-form" autocomplete="off">
          <label class="lab" for="loc-q">从哪里出发</label>
          <div class="row">
            <input id="loc-q" class="in grow" type="search" enterkeyhint="search" placeholder="输入地址、路口或地标，如 3300 Dufferin St、Union Station" aria-autocomplete="list" aria-controls="loc-sug">
            <button class="btn primary" id="loc-go" type="submit">用这个地址</button>
          </div>
          <ul class="sug" id="loc-sug" role="listbox" hidden></ul>
        </form>
        <div class="chips small" id="loc-recent"></div>
        <div class="row">
          <select id="loc-preset" class="in" aria-label="选一个区域"></select>
          <button class="btn" id="pick-btn" type="button">在地图上点选</button>
          <button class="btn" id="geo-btn" type="button">📍 用我现在的位置</button>
        </div>
        <div class="where" id="where"></div>
      </div>
      <div class="pop" id="pop-when" hidden>
        <div class="row">
          <div class="seg" id="when-seg"></div>
          <span id="when-custom" class="row" hidden>
            <select id="when-day" class="in" aria-label="哪天"></select>
            <input id="when-time" type="time" class="in num" value="18:30" aria-label="几点">
          </span>
        </div>
      </div>
    </section>

    <div class="stage">
      <div class="panel">

        <!-- 随便吃 -->
        <section class="view" id="view-rand" aria-labelledby="tab-rand">
          <div class="moods">
            <span class="hint">想吃点什么？不选就完全随机</span>
            <div class="chips" id="moods"></div>
          </div>
          <div id="pick"></div>
        </section>

        <!-- 找一家 -->
        <section class="view" id="view-find" aria-labelledby="tab-find">
          <div class="search">
            <input id="q" class="in grow" placeholder="搜店名、菜系、特色菜或街道，例如 ramen、Spadina、叉烧" aria-label="搜索">
            <button class="btn ghost" id="clear" type="button">清空条件</button>
          </div>
          <div class="chips" id="kw-main"></div>
          <details class="more-kw" id="more-kw">
            <summary>更多条件</summary>
            <div id="kw-more"></div>
            <div class="kg"><span class="lab">显示</span><div class="seg" id="show-seg"></div></div>
          </details>
          <div class="nearby" aria-live="polite">
            <p class="nearby-h" id="nearby-h"></p>
            <div class="chips small" id="nearby"></div>
          </div>
          <div class="listhead"><h2 id="list-h"></h2><div class="seg" id="sort-seg"></div></div>
          <div class="cards" id="cards"></div>
        </section>

        <!-- 收藏 -->
        <section class="view" id="view-fav" aria-labelledby="tab-fav">
          <div class="listhead"><h2 id="fav-h"></h2></div>
          <div class="cards" id="fav-cards"></div>
        </section>
      </div>

      <aside class="mapcol">
        <div class="mapbox" id="mapbox">
          <div id="map" aria-label="餐馆地图"></div>
          <div class="maphint" id="maphint" hidden>点地图任意位置，设为出发点</div>
          <button type="button" class="btn maptool" id="zme" title="回到出发点">◎ 回到出发点</button>
        </div>
        <div class="legend">
          <span><i style="background:var(--me)"></i>出发点</span>
          <span><i style="background:var(--ok)"></i>能吃上</span>
          <span><i style="background:var(--warn)"></i>比较赶 / 等开门</span>
          <span><i style="background:var(--bad)"></i>到时已关</span>
          <span><i class="hollow"></i>时间未知</span>
        </div>
      </aside>
    </div>
  </main>
</div>

<dialog id="about">
  <h2>关于数据</h2>
  <div id="foot"></div>
  <form method="dialog"><button class="btn">知道了</button></form>
</dialog>

<!-- 数据先加载，再运行页面逻辑 -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="data/food-data.js"></script>
<script src="data/dish-data.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
